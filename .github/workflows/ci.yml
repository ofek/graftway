name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Zensical's clean builds remove the checkout's .cache directory.
  UV_CACHE_DIR: ${{ github.workspace }}/../.uv-cache

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read mise version
        id: mise-version
        shell: pwsh
        run: |
          $bootstrapMiseVersion = (Get-Content -LiteralPath .mise-version -Raw).Trim()
          "version=$bootstrapMiseVersion" >> $env:GITHUB_OUTPUT
      - name: Install development tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        id: mise
        with:
          version: ${{ steps.mise-version.outputs.version }}
          cache: true
          cache_save: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          cache_key: graftway-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ hashFiles('.mise-version', 'mise.toml', 'mise.lock', 'rust-toolchain.toml') }}
          persist_github_token: false
      - name: Restore Python package downloads
        id: uv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: graftway-uv-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ hashFiles('mise.toml', 'pyproject.toml', 'uv.lock') }}
      - name: Restore Rust build cache
        if: hashFiles('Cargo.lock') != ''
        uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          backend: github
          toolchain: ${{ fromJSON(steps.mise.outputs.versions).rust[0].version }}
      - name: Run repository checks
        run: mise run check
      - name: Save Python package downloads
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}
