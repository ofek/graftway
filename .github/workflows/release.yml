name: Release readiness

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GRAFTWAY_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read mise version
        id: mise-version
        shell: pwsh
        run: |
          $bootstrapMiseVersion = (Get-Content -LiteralPath .mise-version -Raw).Trim()
          "version=$bootstrapMiseVersion" >> $env:GITHUB_OUTPUT
      - name: Install development tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: ${{ steps.mise-version.outputs.version }}
          cache: false
          persist_github_token: false
      - name: Validate release configuration
        run: mise run release:dry-run
      - name: Verify release readiness
        run: mise run release:verify
