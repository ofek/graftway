name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Zensical's clean builds remove the checkout's .cache directory.
  UV_CACHE_DIR: ${{ github.workspace }}/../.uv-cache

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    if: github.repository == 'ofek/graftway' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read mise version
        id: mise-version
        shell: pwsh
        run: |
          $bootstrapMiseVersion = (Get-Content -LiteralPath .mise-version -Raw).Trim()
          "version=$bootstrapMiseVersion" >> $env:GITHUB_OUTPUT
      - name: Install development tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: ${{ steps.mise-version.outputs.version }}
          cache: true
          cache_save: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          cache_key: graftway-tools-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-${{ hashFiles('.mise-version', 'mise.toml', 'mise.lock', 'rust-toolchain.toml') }}
          persist_github_token: false
      - name: Restore Python package downloads
        id: uv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: graftway-uv-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-${{ hashFiles('mise.toml', 'pyproject.toml', 'uv.lock') }}
      - name: Lint repository
        run: mise run lint
      - name: Build documentation
        run: mise run docs:build
      - name: Save Python package downloads
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}
      - name: Upload documentation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: site
          if-no-files-found: error

  deploy:
    name: Publish documentation branch
    needs: build
    if: github.repository == 'ofek/graftway' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Push the built site to gh-pages.
      pages: write # Request a Pages build after the bot-authenticated push.
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation
          path: site
      - name: Publish site to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: site
          force_orphan: true
          full_commit_message: 'docs: publish documentation'
      - name: Request GitHub Pages build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Pushes made with GITHUB_TOKEN do not trigger Pages builds.
        run: gh api --method POST "repos/$env:GH_REPO/pages/builds"
