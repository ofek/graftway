# This file describes future distribution goals, not available artifacts.
schema-version = 1
publication-enabled = false
version-source = "workspace.package.version"
tag-prefix = "v"
required-evidence = [
  "integration-smoke-tests",
  "duckdb-duckhop-compatibility",
  "checksums",
  "provenance",
  "sbom",
  "third-party-licenses",
  "build-tool-metadata",
]

[[cli]]
target = "x86_64-unknown-linux-gnu"
runner = "ubuntu-24.04"
archive = "tar.gz"

[[cli]]
target = "aarch64-unknown-linux-gnu"
runner = "ubuntu-24.04-arm"
archive = "tar.gz"

[[cli]]
target = "x86_64-apple-darwin"
runner = "macos-15-intel"
archive = "tar.gz"

[[cli]]
target = "aarch64-apple-darwin"
runner = "macos-15"
archive = "tar.gz"

[[cli]]
target = "x86_64-pc-windows-msvc"
runner = "windows-2025"
archive = "zip"

[oci]
components = ["server", "indexing-worker"]
platforms = ["linux/amd64", "linux/arm64"]
