[project]
name = "graftway-infrastructure"
version = "0.0.0"
description = "Repository development and documentation tools"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "check-jsonschema==0.38.2",
  "pip-licenses==5.5.5",
  "pytest==9.1.1",
  "ruff==0.17.2",
  "zensical==0.0.70",
  "zizmor==1.30.1",
]

[tool.ruff]
target-version = "py313"
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]
addopts = "-ra"

[tool.pip-licenses]
from = "mixed"
with-system = true
# Match complete metadata values, including older classifier names.
allow-only = """
MIT;
MIT License;
Apache-2.0;
Apache Software License;
BSD-2-Clause;
BSD-3-Clause;
ISC;
ISC License (ISCL);
PSF-2.0;
Python Software Foundation License;
MPL-2.0;
Mozilla Public License 2.0 (MPL 2.0);
Apache-2.0 OR BSD-2-Clause
"""
# These exact versions were reviewed as BSD-3-Clause despite generic BSD metadata.
# Review new versions before adding exceptions; do not allow generic BSD globally.
ignore-packages = ["Jinja2:3.1.6", "colorama:0.4.6"]
